query GetCollectionByHandle(
  $handle: String!
  $first: Int!
  $after: String
  $language: LanguageCode!
) @inContext(language: $language) {
  collection(handle: $handle) {
    ...CollectionFields
    products(first: $first, after: $after) {
      edges {
        node {
          ...ProductFields
        }
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
    }
  }
}
