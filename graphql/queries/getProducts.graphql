query GetProducts($first: Int!, $after: String, $language: LanguageCode!)
@inContext(language: $language) {
  products(first: $first, after: $after) {
    edges {
      node {
        ...ProductFields
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
